[bar.default]
background_opacity = 0.95
color = "tertiary"
end = [
    "bar_3",
    "widget",
    "privacy",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "bar",
    "session",
    "bar_2"
]
margin_ends = 15
radius = 20
radius_top_left = 20
scale = 1.2
start = [ "control-center", "workspaces", "active_window", "cpu", "ram", "temp", "media" ]
thickness = 40
widget_spacing = 15

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 1000

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 576.0
    box_width = 1936.0
    cx = 1016.0
    cy = 1810.0
    output = "DP-1"
    placement_height = 2160.0
    placement_width = 5120.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = true
        background_color = "surface"
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 576.0
    box_width = 832.0
    cx = 4640.0
    cy = 1810.0
    output = "DP-1"
    placement_height = 2160.0
    placement_width = 5120.0
    rotation = 0.0
    type = "calendar"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 352.0
    box_width = 816.0
    cx = 2576.0
    cy = 440.0
    output = "DP-1"
    placement_height = 2160.0
    placement_width = 5120.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false
        background_color = "primary"
        clock_style = "digital"
        shadow = true

[location]
address = "Santa Clara, California"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1978.0
    output = "DP-1"
    placement_height = 2160.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.8
border = false
offset_x = 35
offset_y = 12
scale = 1.3

[osd]
background_opacity = 0.45
offset_x = 30
offset_y = 12
position = "bottom_center"
position_vertical = "bottom_center"
scale = 1.5

[plugin_settings."nekoshinobi/yay-updater"]
terminalCommand = "wezterm start --"

[plugins]
auto_update = "all"
enabled = [
    "autumn/network-toolkit",
    "noctalia/wallhaven",
    "nekoshinobi/apcupsd",
    "nekoshinobi/yay-updater",
    "3ri4ng0ld/ip-monitor",
    "nekoshinobi/jds-output"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/NekoShinobi/noctalia-plugins.git"
    name = "noctalia-nekoshinobi-plugins"

[shell]
font_family = "GT Walsheim Pro"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "qt", "starship", "wezterm" ]
    community_ids = [ "libreoffice", "neovim", "vscode", "zed", "steam", "walker", "fastfetch", "obs", "fcitx5", "fzf", "yazi" ]

[wallpaper.default]
path = "/home/user/Pictures/wallhaven-rrdgp1.jpg"

[wallpaper.last]
path = "/home/user/Pictures/wallhaven-rrdgp1.jpg"

[wallpaper.monitors.DP-1]
path = "/home/user/Pictures/wallhaven-rrdgp1.jpg"

[widget.bar]
type = "nekoshinobi/apcupsd:bar"

[widget.bar_2]
type = "nekoshinobi/yay-updater:bar"

[widget.bar_3]
type = "nekoshinobi/jds-output:bar"

[widget.clock]
format = "{:%m/%d/%Y - %H:%M}"

[widget.widget]
mode = "custom_command"
type = "3ri4ng0ld/ip-monitor:widget"

[widget.workspaces]
font_family = "GT Walsheim Pro"
pill_scale = 0.95
